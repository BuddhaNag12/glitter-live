<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Glitter Live Admin</title>
<style>
  :root {
    --bg: #0b1020; --surface: #151b2e; --line: #26304a; --text: #e7ecf5; --muted: #8b95ab;
    --accent: #3b82f6; --danger: #ef4444; --ok: #22c55e;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f8fafc; --surface: #ffffff; --line: #cbd5e1; --text: #0f172a; --muted: #475569; color-scheme: light; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  section { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 20px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=email], input[type=password], input[type=url], input[type=file] {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; width: 100%;
  }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 14px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 9px 18px; background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); padding: 6px 12px; }
  button:disabled { opacity: .5; cursor: default; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-top: 14px; }
  .status { min-height: 20px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .status.error { color: var(--danger); }
  #login { max-width: 360px; margin: 10vh auto; display: grid; gap: 12px; }
  #preview { width: 90px; aspect-ratio: 9/16; object-fit: cover; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
  ul { list-style: none; margin: 0; padding: 0; }
  li.item { display: grid; grid-template-columns: 20px 64px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  li.item:first-child { border-top: 0; }
  li.item.dragging { opacity: .4; }
  li.item.over { box-shadow: 0 -2px 0 var(--accent); }
  .handle { cursor: grab; color: var(--muted); user-select: none; text-align: center; }
  li.item img { width: 64px; aspect-ratio: 9/16; object-fit: cover; border-radius: 8px; background: var(--bg); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 6px; }
  .fields input { padding: 6px 9px; font-size: 14px; }
  .meta { font-size: 12px; color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); margin-right: 6px; }
  .toggles { display: grid; gap: 6px; justify-items: start; }
  @media (max-width: 600px) { li.item { grid-template-columns: 16px 52px 1fr; } .toggles { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 12px; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <form id="login" hidden>
    <h1>Glitter Live Admin</h1>
    <label>Email <input id="email" type="email" autocomplete="username" required></label>
    <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign In</button>
    <div id="login-status" class="status" role="status"></div>
  </form>

  <div id="app" hidden>
    <header>
      <h1>Glitter Live Admin</h1>
      <button id="sign-out" class="secondary">Sign Out</button>
    </header>

    <section>
      <h2>Upload</h2>
      <form id="upload">
        <div class="row" style="margin-top:0">
          <img id="preview" alt="" hidden>
          <label style="flex:1">Video (≤ 5 s, MP4 or MOV) or image (JPEG or PNG)
            <input id="file" type="file" accept="video/mp4,video/quicktime,image/jpeg,image/png" required>
          </label>
        </div>
        <div class="grid" style="margin-top:12px">
          <label>Title <input id="title" type="text" maxlength="80" required></label>
          <label>Category <input id="category" type="text" list="categories" required></label>
          <label>Creator <input id="creator" type="text"></label>
          <label>Creator link <input id="creator-url" type="url" placeholder="https://"></label>
        </div>
        <datalist id="categories"></datalist>
        <div class="row">
          <label class="check"><input id="published" type="checkbox"> Published</label>
          <label class="check"><input id="featured" type="checkbox"> Featured</label>
          <button id="upload-button" type="submit">Upload</button>
        </div>
        <div id="upload-status" class="status" role="status"></div>
      </form>
    </section>

    <section>
      <h2>Wallpapers</h2>
      <p class="meta" style="margin:-6px 0 10px">Drag to reorder. Edits save when you leave a field. Use Safari for uploads; other browsers may not read MOV or HEVC.</p>
      <ul id="list"></ul>
      <div id="list-status" class="status" role="status"></div>
    </section>
  </div>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
