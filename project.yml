name: LiveWall
options:
  bundleIdPrefix: dev.distinction
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
fileGroups: [StoreKit]
packages:
  # Rewarded ads; brings Google's consent SDK (UMP) with it.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.11.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: C3ZASV2S6N
    CODE_SIGN_STYLE: Automatic
targets:
  LiveWall:
    type: application
    platform: iOS
    sources: [LiveWall]
    dependencies:
      - package: GoogleMobileAds
    info:
      path: LiveWall/Info.plist
      properties:
        CFBundleDisplayName: Glitter Live
        # XcodeGen otherwise writes a fixed 1.0 (1), ignoring the version settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Without this, custom animations are capped at 60 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Only standard HTTPS, so App Store Connect can skip the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Glitter Live saves the live wallpapers you create to your photo library.
        NSUserTrackingUsageDescription: Your choice only changes which ads you see. Glitter Live shows an ad only when you choose to watch one.
        # Debug builds use Google's sample app ID; release takes the real one from GAD_APPLICATION_ID.
        GADApplicationIdentifier: $(GAD_APPLICATION_ID)
        # Google's list of ad networks allowed to attribute installs from its ads.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
