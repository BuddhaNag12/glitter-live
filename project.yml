name: LiveWall
options:
  bundleIdPrefix: dev.distinction
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
fileGroups: [StoreKit]
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: C3ZASV2S6N
    CODE_SIGN_STYLE: Automatic
targets:
  LiveWall:
    type: application
    platform: iOS
    sources: [LiveWall]
    info:
      path: LiveWall/Info.plist
      properties:
        CFBundleDisplayName: Glitter Live
        # XcodeGen otherwise writes a fixed 1.0 (1), ignoring the version settings above.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Without this, custom animations are capped at 60 Hz on ProMotion iPhones.
        CADisableMinimumFrameDurationOnPhone: true
        # Only standard HTTPS, so App Store Connect can skip the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Glitter Live saves the live wallpapers you create to your photo library.
        UIAppFonts: [Inter-Light.ttf, Inter-Regular.ttf, Inter-Medium.ttf, Inter-SemiBold.ttf, Inter-Bold.ttf]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.distinction.livewall
        TARGETED_DEVICE_FAMILY: "1"
        # Compiles the Metal files as Core Image kernels (DepthParallax.metal).
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -cikernel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LiveWallTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiveWallTests]
    dependencies:
      - target: LiveWall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.distinction.livewall.tests
        GENERATE_INFOPLIST_FILE: YES
  LiveWallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LiveWallUITests]
    dependencies:
      - target: LiveWall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.distinction.livewall.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_TARGET_NAME: LiveWall
schemes:
  LiveWall:
    build:
      targets:
        LiveWall: all
    run:
      # Local products for purchases run from Xcode; device installs outside Xcode use App Store sandbox products.
      storeKitConfiguration: StoreKit/LiveWall.storekit
    test:
      targets: [LiveWallTests, LiveWallUITests]
