name: Release

# Tags and releases each App Store version once its MARKETING_VERSION bump lands on main,
# so every version has a vX.Y.Z tag and a GitHub release without tagging by hand.
on:
  push:
    branches: [main]
    paths: [project.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Tag and release the version if it's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' project.yml)
          if [ -z "$version" ]; then
            echo "::error::MARKETING_VERSION not found in project.yml"
            exit 1
          fi
          tag="v$version"
          # project.yml also changes for other reasons; only a new version gets a release.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" --target "$GITHUB_SHA" --generate-notes --title "Glitter Live $version" $prerelease
