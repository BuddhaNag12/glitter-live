name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and unit tests
    # Xcode 27 is only on a preview image; the app builds with the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=latest
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install the Metal toolchain
        # DepthParallax.metal needs it, and Xcode doesn't include it.
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Build for testing
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project LiveWall.xcodeproj \
            -scheme LiveWall \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm \
            -quiet \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        timeout-minutes: 25
        # One test at a time: the video tests compete for the runner's three cores. Diagnostics are off
        # because Xcode takes the slow video tests for hung and stalls collecting them.
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project LiveWall.xcodeproj \
            -scheme LiveWall \
            -destination "$DESTINATION" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm \
            -only-testing:LiveWallTests \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -resultBundlePath TestResults.xcresult

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestResults
          path: TestResults.xcresult

  function:
    name: Type-check the Supabase function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/generate/index.ts
