name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and unit tests
    # Xcode 27 is only on a preview image; the app builds with the iOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install the Metal toolchain
        # DepthParallax.metal needs it, and Xcode doesn't include it.
        run: xcodebuild -downloadComponent MetalToolchain

      - uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}

      - name: Run unit tests
        # The video tests are slow enough that Xcode takes them for hung and pauses the app to collect
        # diagnostics, which can stall the run for good. Turning that off keeps it moving.
        run: |
          set -o pipefail
          xcodebuild test \
            -project LiveWall.xcodeproj \
            -scheme LiveWall \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -clonedSourcePackagesDirPath .spm \
            -only-testing:LiveWallTests \
            -resultBundlePath TestResults.xcresult \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestResults
          path: TestResults.xcresult

  function:
    name: Type-check the Supabase function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/generate/index.ts
